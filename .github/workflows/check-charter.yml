# Reusable workflow: check if dev-charter is up to date and open a PR if not.
#
# For setup instructions, see "Version Check (CI)" in README.md.

name: Dev Charter

on:
  workflow_call:
    inputs:
      prefix:
        description: "Path to the dev-charter subtree within the project"
        default: "docs/dev-charter"
        type: string
      branch:
        description: "dev-charter branch/variant to track (main = full, lite = lite)"
        default: "main"
        type: string
  workflow_dispatch:
    inputs:
      prefix:
        description: "Path to the dev-charter subtree within the project"
        default: "."
        type: string
      branch:
        description: "dev-charter branch/variant to track (main = full, lite = lite)"
        default: "main"
        type: string
  push:
    branches: [main]
    paths:
      - ".github/workflows/check-charter.yml"
      - "VERSION"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: read

    steps:
      # pull_request / push triggers fire on every PR and every push to main;
      # skip if a check already succeeded within the last 7 days so busy repos
      # don't re-check on every single event. schedule / workflow_dispatch
      # always run (steps.throttle.outputs.skip stays empty in that case).
      - name: Skip if checked recently
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        id: throttle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          WORKFLOW_FILE=$(basename "$(echo "${{ github.workflow_ref }}" | sed 's/@.*$//')")
          LAST=$(gh api "repos/${{ github.repository }}/actions/workflows/${WORKFLOW_FILE}/runs?status=success&per_page=1" \
            --jq '.workflow_runs[0].updated_at // empty' 2>/dev/null || echo "")

          if [ -z "$LAST" ]; then
            echo "No prior successful run found"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          DAYS=$(( ( $(date -u +%s) - $(date -u -d "$LAST" +%s) ) / 86400 ))
          echo "Last successful check: ${LAST} (${DAYS} day(s) ago)"

          if [ "$DAYS" -lt 7 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout (full history required for git subtree)
        if: steps.throttle.outputs.skip != 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check VERSION
        if: steps.throttle.outputs.skip != 'true'
        id: versions
        run: |
          PREFIX="${{ inputs.prefix }}"
          PREFIX="${PREFIX:-"."}"
          BRANCH="${{ inputs.branch }}"
          BRANCH="${BRANCH:-main}"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

          REMOTE=$(curl -sf --max-time 10 \
            "https://raw.githubusercontent.com/y-marui/dev-charter/${BRANCH}/VERSION" \
            | head -1)
          if [ -z "$REMOTE" ]; then
            echo "::error::Failed to fetch remote VERSION from dev-charter"
            exit 1
          fi

          LOCAL=$(head -1 "${PREFIX}/VERSION" 2>/dev/null || echo "")
          if [ -z "$LOCAL" ]; then
            echo "::error::Local VERSION not found at ${PREFIX}/VERSION"
            exit 1
          fi

          # Guard against a misconfigured `branch:` input silently pulling the
          # wrong variant (full vs lite) on the next update. The lite variant's
          # CHARTER_INDEX.md always contains "(lite)" (generated by
          # scripts/publish-lite-branch.sh); full's never does.
          if [ -f "${PREFIX}/CHARTER_INDEX.md" ]; then
            INSTALLED_VARIANT="main"
            if grep -q '(lite)' "${PREFIX}/CHARTER_INDEX.md"; then
              INSTALLED_VARIANT="lite"
            fi
            if [ "$INSTALLED_VARIANT" != "$BRANCH" ]; then
              echo "::error::Installed dev-charter at ${PREFIX} looks like the '${INSTALLED_VARIANT}' variant, but this workflow is configured with branch: ${BRANCH}. Fix the 'branch' input in the caller workflow (see README's Lite Version section) — otherwise this would try to update to the wrong variant."
              exit 1
            fi
          fi

          echo "local:  ${LOCAL}"
          echo "remote: ${REMOTE}"
          echo "remote=${REMOTE}" >> "$GITHUB_OUTPUT"
          echo "prefix=${PREFIX}" >> "$GITHUB_OUTPUT"

          if [ "$LOCAL" = "$REMOTE" ]; then
            echo "dev-charter is up to date"
            echo "outdated=false" >> "$GITHUB_OUTPUT"
          else
            echo "dev-charter is outdated"
            echo "outdated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update branch
        if: steps.throttle.outputs.skip != 'true' && steps.versions.outputs.outdated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REMOTE="${{ steps.versions.outputs.remote }}"
          SOURCE_BRANCH="${{ steps.versions.outputs.branch }}"
          BRANCH="update-charter"
          [ "${SOURCE_BRANCH}" = "main" ] || BRANCH="update-charter-${SOURCE_BRANCH}"
          PREFIX="${{ steps.versions.outputs.prefix }}"

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          git remote add dev-charter https://github.com/y-marui/dev-charter.git || true
          git fetch dev-charter "${SOURCE_BRANCH}"

          git checkout -B "${BRANCH}" origin/main

          if ! git subtree pull \
              --prefix="${PREFIX}" \
              dev-charter "${SOURCE_BRANCH}" \
              --squash \
              -m "chore: update dev-charter to ${REMOTE}"; then
            # Fallback: template project (no subtree history)
            # Clean up any partial state from the failed attempt
            git reset --hard HEAD
            git clean -fd "${PREFIX}/"

            SPLIT=$(git rev-parse "dev-charter/${SOURCE_BRANCH}")
            rm -rf "${PREFIX}/"
            mkdir -p "${PREFIX}"
            git archive "dev-charter/${SOURCE_BRANCH}" | tar -x -C "${PREFIX}/"
            git add "${PREFIX}/"

            git commit -m "$(printf "Squashed '%s/' content from commit %s\n\ngit-subtree-dir: %s\ngit-subtree-split: %s" \
              "${PREFIX}" "${SPLIT}" "${PREFIX}" "${SPLIT}")"
          fi

          git push origin "${BRANCH}" --force-with-lease

      - name: Create PR
        if: steps.throttle.outputs.skip != 'true' && steps.versions.outputs.outdated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REMOTE="${{ steps.versions.outputs.remote }}"
          SOURCE_BRANCH="${{ steps.versions.outputs.branch }}"
          BRANCH="update-charter"
          [ "${SOURCE_BRANCH}" = "main" ] || BRANCH="update-charter-${SOURCE_BRANCH}"

          gh label create "dev-charter" --color "#0075ca" --description "dev-charter update" --force

          # lite にはINSTALL_CHECKLIST.md/UPDATE_CHECKLIST.md が含まれない
          # （scripts/lite-manifest.txt で full 専用として除外）ため、
          # 存在しないファイルを案内しないよう本文を branch ごとに分ける。
          if [ "${SOURCE_BRANCH}" = "main" ]; then
            BODY=$(cat <<EOF
          ## Update dev-charter to ${REMOTE}

          \`git subtree pull\` has been applied automatically.
          This PR is a **Draft**. Complete the following steps, then mark it as ready:

          1. Open \`docs/dev-charter/UPDATE_CHECKLIST.md\` and paste its contents into your AI tool to apply the changes.
          2. Review and commit the changes.
          3. Run \`gh pr ready\` to remove the Draft status.

          > To review all charter files (not just changed ones), use \`docs/dev-charter/INSTALL_CHECKLIST.md\`.

          ---

          ## dev-charter を ${REMOTE} に更新

          \`git subtree pull\` を自動的に適用しました。
          この PR は **Draft** です。以下の手順を完了してから Draft を解除してください：

          1. \`docs/dev-charter/UPDATE_CHECKLIST.md\` の内容を AI ツールに貼り付けて対応を実行する
          2. 変更をレビュー・コミットする
          3. \`gh pr ready\` を実行して Draft を解除する

          > 全ファイルを網羅的に確認したい場合は \`docs/dev-charter/INSTALL_CHECKLIST.md\` を使用してください。
          EOF
          )
          else
            BODY=$(cat <<EOF
          ## Update dev-charter (${SOURCE_BRANCH}) to ${REMOTE}

          \`git subtree pull\` has been applied automatically. Review the diff, then merge.

          ---

          ## dev-charter（${SOURCE_BRANCH}）を ${REMOTE} に更新

          \`git subtree pull\` を自動的に適用しました。差分を確認してマージしてください。
          EOF
          )
          fi

          gh pr create \
            --title "chore: update dev-charter (${SOURCE_BRANCH}) to ${REMOTE}" \
            --body "$BODY" \
            --base main \
            --head "${BRANCH}" \
            --label "dev-charter" \
            --assignee "${{ github.repository_owner }}" \
            --draft || \
            gh pr list --head "${BRANCH}" --base main --json number --jq length | grep -q '^[1-9]'

      # Fails the check on purpose. This workflow is event-driven (no
      # schedule trigger), so if we only opened the update PR above and
      # returned success here, an outdated charter would never actually
      # block anything -- it'd just leave a draft PR sitting unnoticed
      # while unrelated PRs keep merging. Failing loudly on the PR/push
      # that triggered this check forces it to be dealt with.
      - name: Fail if outdated
        if: steps.throttle.outputs.skip != 'true' && steps.versions.outputs.outdated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SOURCE_BRANCH="${{ steps.versions.outputs.branch }}"
          BRANCH="update-charter"
          [ "${SOURCE_BRANCH}" = "main" ] || BRANCH="update-charter-${SOURCE_BRANCH}"
          PR_NUM=$(gh pr list --repo "${{ github.repository }}" --head "${BRANCH}" --base main --json number --jq '.[0].number // empty')
          echo "::error::dev-charter is outdated (local VERSION does not match remote ${{ steps.versions.outputs.remote }})."
          if [ -n "$PR_NUM" ]; then
            echo "::error::An update PR is ready: #${PR_NUM}. Merge it (or apply docs/dev-charter/UPDATE_CHECKLIST.md manually), then re-run this check."
          else
            echo "::error::Could not find/create the update-charter PR. Run 'make update-charter' (or git subtree pull) manually."
          fi
          exit 1
