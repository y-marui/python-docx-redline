[project]
name = "docx-redline"
version = "0.1.0"
description = "Minimal, safe Word (.docx) tracked-change (redline) editing CLI"
authors = [{ name = "Yukihiro Marui" }]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "lxml>=5.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.3",
    "mypy>=1.8",
]

[project.scripts]
docx-redline = "docx_redline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docx_redline"]

[tool.ruff]
line-length = 88
target-version = "py311"
# dev-charter is vendored, read-only documentation rather than project code.
exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Fixed OOXML template strings; breaking attributes across lines would hurt
# readability without benefit.
"tests/conftest.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = "lxml.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
